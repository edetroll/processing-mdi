<text x="70" y="405">ÉS esetén mindkét feltételnek igaznak kell lennie.</text>
<text x="70" y="440">VAGY esetén elegendő, ha legalább az egyik feltétel igaz.</text>
<text x="70" y="475">A negáció megfordítja a logikai értéket.</text>
