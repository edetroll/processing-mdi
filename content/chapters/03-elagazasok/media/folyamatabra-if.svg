<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
<style>
text{font-family:Arial,sans-serif;fill:#252a31;font-size:21px}
.small{font-size:18px;fill:#52606d}
.shape{fill:#fff;stroke:#6d7b88;stroke-width:2.5}
.decision{fill:#e8f0f3;stroke:#376f82;stroke-width:3}
.arrow{fill:none;stroke:#52606d;stroke-width:2.7;marker-end:url(#arrow)}
.path{fill:none;stroke:#52606d;stroke-width:2.7}
</style>
<defs>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
<path d="M0,0 L0,7 L10,3.5 z" fill="#52606d"/>
</marker>
</defs>
<rect width="900" height="620" rx="18" fill="#f8fafb"/>

<rect class="shape" x="350" y="35" width="200" height="66" rx="32"/>
<text x="450" y="76" text-anchor="middle">Végrehajtás</text>

<path class="arrow" d="M450 101 V145"/>

<polygon class="decision" points="450,145 585,225 450,305 315,225"/>
<text x="450" y="217" text-anchor="middle">Feltétel</text>
<text x="450" y="244" text-anchor="middle">igaz?</text>

<!-- TRUE: main vertical path -->
<path class="arrow" d="M450 305 V355"/>
<text class="small" x="468" y="338">igaz</text>

<rect class="shape" x="325" y="355" width="250" height="78" rx="10"/>
<text x="450" y="388" text-anchor="middle">Feltételes utasítás</text>
<text x="450" y="416" text-anchor="middle">végrehajtása</text>

<path class="path" d="M450 433 V505"/>

<!-- FALSE: side bypass to the same merge point -->
<path class="path" d="M585 225 H710 V505 H455"/>
<text class="small" x="610" y="210">hamis</text>

<!-- merge and continuation -->
<circle cx="450" cy="505" r="5" fill="#52606d"/>
<path class="arrow" d="M450 510 V548"/>

<rect class="shape" x="350" y="548" width="200" height="52" rx="26"/>
<text x="450" y="581" text-anchor="middle">Folytatás</text>
</svg>